<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142235"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Meu Treino & Nutri</title><style>body{margin:0;background:#0e1726;color:#f5f7fb;font:16px system-ui}header{padding:24px 18px;background:#182a41}h1{margin:0;font-size:23px}small,.muted{color:#aebdd0}main{max-width:760px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;margin:14px 0}button{background:#263d56;border:1px solid #45617a;border-radius:12px;color:white;padding:12px;cursor:pointer}button.active,.primary{background:#1a846f}section{background:#19283b;border-radius:16px;padding:16px;margin:12px 0}h2{margin-top:0}article{border-top:1px solid #33465d;padding:12px 0}input,select,textarea{background:#0d1928;color:white;border:1px solid #5a6d80;border-radius:9px;padding:10px;box-sizing:border-box;max-width:100%}input[type=number]{width:90px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#304960;padding:5px 8px;border-radius:8px;font-size:13px}a{color:#7fe2ce}label{display:block;margin:9px 0}footer{padding:22px;text-align:center;color:#aebdd0}</style></head><body><header><h1>💪 Meu Treino & Nutri</h1><small>Seu painel de treino, alimentação e evolução</small></header><main><nav id="nav"></nav><div id="view"></div></main><footer>Dados salvos somente neste navegador nesta versão. Faça backups regularmente.</footer><script>
const plan=[
{day:"Segunda",name:"Push A · Peito, ombros e tríceps",ex:[["Supino reto com barra","55 kg total","3 × 6–10","150–180 s"],["Supino inclinado com halteres","24 kg cada","3 × 8–12","120–150 s"],["Crucifixo na polia","25 kg/lado","2 × 10–15","60–90 s"],["Desenvolvimento com halteres","20 kg cada","2 × 8–12","120 s"],["Tríceps na corda","40 kg","3 × 10–15","60–90 s"],["Elevação lateral","10 kg cada","2 × 12–15","60–90 s"]]},
{day:"Terça",name:"Pull A · Costas e bíceps",ex:[["Puxada frontal","60 kg","3 × 8–12","120 s"],["Remada curvada com barra","65 kg total","3 × 8–10","150–180 s"],["Remada baixa","60 kg","2 × 10–12","120 s"],["Crucifixo inverso","A definir","3 × 12–15","60–90 s"],["Rosca direta com barra","30 kg total","3 × 8–12","90 s"],["Rosca martelo","16 kg cada","2 × 10–12","60–90 s"]]},
{day:"Quarta",name:"Legs A · Quadríceps",ex:[["Hack squat","150 kg em anilhas","3 × 8–10","150–180 s"],["Leg press 45°","200 kg em anilhas","3 × 10–12","150–180 s"],["Cadeira extensora","60 kg","2 × 10–15","75–90 s"],["Cadeira flexora sentada","40 kg","3 × 10–12","75–90 s"],["Panturrilha em pé","40 kg","3 × 10–15","60–90 s"]]},
{day:"Quinta",name:"Push B · Ombros e peito",ex:[["Desenvolvimento com halteres","20 kg cada","3 × 8–12","120–150 s"],["Supino inclinado com barra","40 kg total","3 × 8–12","120–150 s"],["Elevação lateral","10 kg cada","3 × 12–15","60–90 s"],["Crossover na polia","25 kg/lado","2 × 10–15","60–90 s"],["Tríceps francês com halter","22 kg","3 × 10–12","75–90 s"],["Tríceps na corda","40 kg","2 × 10–15","60–90 s"]]},
{day:"Sexta",name:"Pull B · Costas e bíceps",ex:[["Remada baixa","60 kg","3 × 8–12","120 s"],["Puxada frontal","60 kg","3 × 10–12","120 s"],["Remada com apoio para o peito","A definir","2 × 10–12","90–120 s"],["Crucifixo inverso","A definir","2 × 12–15","60–90 s"],["Rosca martelo","16 kg cada","3 × 10–12","75–90 s"],["Rosca direta com barra","30 kg total","2 × 10–12","75–90 s"]]},
{day:"Sábado",name:"Legs B · Posteriores e glúteos",ex:[["Levantamento terra romeno com halteres","A definir","3 × 8–10","150 s"],["Cadeira flexora sentada","40 kg","3 × 10–12","90 s"],["Leg press 45°","200 kg em anilhas","3 × 10–12","150 s"],["Cadeira extensora","60 kg","2 × 12–15","75–90 s"],["Panturrilha em pé","40 kg","3 × 12–15","60–90 s"]]},
{day:"Domingo",name:"Descanso e recuperação",ex:[]}];
const meals=[["Café da manhã","50 g pão, 2 ovos, 20 g muçarela, 170 g mamão"],["Almoço","250 g arroz cozido, 100 g feijão, 120 g frango ou carne magra, 100 g legumes e folhas"],["Lanche da tarde","50 g pão, 2 ovos, 23 g requeijão light"],["Pré-treino habitual","2 bananas médias, 15 g whey 80%; ajustar ao horário do treino"],["Jantar","250 g arroz cozido, 100 g feijão, 120 g peixe ou carne magra, legumes e folhas"]];
const swaps={Proteínas:[["Frango cozido","100 g"],["Patinho cozido","110–120 g"],["Peixe branco cozido","120–140 g"],["Atum escorrido","120–130 g"],["Whey 80%","38–40 g"]],Carboidratos:[["Arroz cozido","130–140 g"],["Batata inglesa cozida","190–210 g"],["Batata-doce cozida","170–190 g"],["Macarrão cozido","120–130 g"],["Pão francês","70–75 g"]],Gorduras:[["Azeite","11 g"],["Abacate","65–75 g"],["Castanhas","18–22 g"]]};
let tab="Hoje",chosen=(new Date().getDay()+6)%7;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getLog(){try{return JSON.parse(localStorage.getItem("mtndata")||"[]")}catch{return []}}
function addLog(kind,detail){const a=getLog();a.push({at:new Date().toISOString(),tipo:kind,detalhe:detail});localStorage.setItem("mtndata",JSON.stringify(a));render()}
function nav(t){tab=t;render()}
function render(){document.querySelector("#nav").innerHTML=["Hoje","Treinos","Cardápio","Registrar","Evolução"].map(t=>'<button class="'+(t===tab?"active":"")+'" onclick="nav(\''+t+'\')">'+t+'</button>').join("");let v="";
if(tab==="Hoje"){const d=plan[(new Date().getDay()+6)%7];v='<section><h2>🏋️ Treino de hoje</h2><b>'+d.day+' — '+d.name+'</b><p>'+d.ex.length+' exercícios previstos</p><button class="primary" onclick="chosen='+(new Date().getDay()+6)%7+';nav(\'Treinos\')">Abrir treino</button></section><section><h2>🥗 Cardápio de hoje</h2>'+meals.map(m=>'<article><b>'+m[0]+'</b><p>'+m[1]+'</p></article>').join('')+'<button onclick="nav(\'Cardápio\')">Ver substituições</button></section>'}
if(tab==="Treinos"){v='<section><h2>Treino semanal</h2><select onchange="chosen=Number(this.value);render()">'+plan.map((d,i)=>'<option value="'+i+'" '+(chosen===i?"selected":"")+'>'+d.day+'</option>').join('')+'</select><h3>'+plan[chosen].name+'</h3><p class="muted">Carga inicial de referência, ajuste conforme execução e esforço. Deixe 1–2 repetições em reserva.</p>'+plan[chosen].ex.map((e,i)=>'<article><b>'+(i+1)+'. '+e[0]+'</b><p><span class="pill">'+e[1]+'</span> <span class="pill">'+e[2]+'</span> <span class="pill">Descanso '+e[3]+'</span></p><p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+" execução correta musculação")+'">▶ Buscar demonstração</a></p><div class="row"><input aria-label="Carga realizada" id="w'+i+'" placeholder="Carga"><input aria-label="Repetições realizadas" id="r'+i+'" placeholder="Reps"><button onclick="addLog(\'Treino\',plan[chosen].day+\' - \'+plan[chosen].ex['+i+'][0]+\': \'+document.getElementById(\'w'+i+'\').value+\' kg, \'+document.getElementById(\'r'+i+'\').value+\' reps\')">Salvar série</button></div></article>').join('')+'</section>'}
if(tab==="Cardápio"){v='<section><h2>Cardápio-base</h2><p class="muted">Faixa provisória: 2.400–2.600 kcal/dia; proteínas 145–165 g/dia. Ajustar conforme evolução.</p>'+meals.map(m=>'<article><b>'+m[0]+'</b><p>'+m[1]+'</p></article>').join('')+'</section><section><h2>Trocas aproximadas</h2>'+Object.entries(swaps).map(([k,arr])=>'<h3>'+k+'</h3>'+arr.map(x=>'<p>'+x[0]+' — '+x[1]+'</p>').join('')).join('')+'<p class="muted">As trocas não são equivalentes em todos os nutrientes e calorias.</p></section>'}
if(tab==="Registrar"){v='<section><h2>Registrar alimentação ou observações</h2><label>Tipo <select id="kind"><option>Refeição</option><option>Peso e cintura</option><option>Suplemento</option><option>Observação</option></select></label><label>Descrição <textarea id="detail" rows="5" style="width:100%" placeholder="Ex.: almoço com 250 g arroz, 100 g feijão..."></textarea></label><button class="primary" onclick="if(document.getElementById(\'detail\').value.trim())addLog(document.getElementById(\'kind\').value,document.getElementById(\'detail\').value)">Salvar registro</button><p class="muted">Para enviar fotos ou conversar por voz, abra este projeto no aplicativo ChatGPT. A ligação automática ainda não está implementada.</p></section>'}
if(tab==="Evolução"){const logs=getLog().slice().reverse();v='<section><h2>Histórico local</h2><button onclick="const a=document.createElement(\'a\');a.href=URL.createObjectURL(new Blob([JSON.stringify(getLog(),null,2)],{type:\'application/json\'}));a.download=\'meu-treino-nutri-backup.json\';a.click()">Exportar backup</button>'+(!logs.length?'<p>Nenhum registro ainda.</p>':logs.map(x=>'<article><small>'+new Date(x.at).toLocaleString("pt-BR")+' · '+esc(x.tipo)+'</small><p>'+esc(x.detalhe)+'</p></article>').join(''))+'</section>'}
document.querySelector("#view").innerHTML=v}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
