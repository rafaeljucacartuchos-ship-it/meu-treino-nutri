const FLEX_KEY="mtn-flex-schedule-v1";
function flexRead(){try{return JSON.parse(localStorage.getItem(FLEX_KEY)||"{}")}catch{return {}}}
let flexSchedule=flexRead();
function flexDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function flexAdd(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return flexDate(d)}
function flexWeek(s){return (new Date(s+"T12:00:00").getDay()+6)%7}
function flexEntry(s){return flexSchedule[s]||null}
function flexSave(){localStorage.setItem(FLEX_KEY,JSON.stringify(flexSchedule))}
function flexAssigned(date){
 const keys=Object.keys(flexSchedule).filter(k=>k<=date).sort();
 if(!keys.length)return flexWeek(date);
 const anchor=keys[0],start=flexEntry(anchor);let cursor=Number.isInteger(start.planned)?start.planned:flexWeek(anchor);
 for(let day=anchor;day<=date;day=flexAdd(day,1)){
  const record=flexEntry(day),sun=flexWeek(day)===6;
  if(sun&&!record?.forceWorkout){if(day===date)return 6;continue}
  const index=cursor%6;
  if(day===date)return record&&Number.isInteger(record.planned)?record.planned:index;
  if(record?.status==="completed")cursor=(Number.isInteger(record.planned)?record.planned:index)+1;
  else if(!record)cursor++;
 }
 return cursor%6;
}
function flexToday(){return flexAssigned(flexDate())}

 '<div class="flexactions"><button onclick="flexToggle(\'activity\')">🚴 Atividade opcional</button><button onclick="flexToggle(\'replan\')">📅 Reprogramar</button></div>'+
 '<div id="flex-activity" class="flexhidden"><h3>Registrar atividade</h3><label>Data <input type="date" id="flex-date" value="'+today+'"></label><label>Atividade <select id="flex-type">'+activities.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></label><label>Minutos <input type="number" id="flex-min" min="1" max="1440" value="20"></label><label>Intensidade <select id="flex-intensity"><option value="">Não informada</option><option>Leve</option><option>Moderada</option><option>Intensa</option></select></label><label>Observações <input id="flex-notes" placeholder="Opcional"></label><button class="primary" onclick="flexActivitySave()">Salvar atividade</button></div>'+

function exerciseVisual(name){const id=exercisePhotoIds[name];const muscles=Object.entries(muscleHints).find(([k])=>name.startsWith(k));if(!id)return '<div class="exercise-visual"><small>Imagem demonstrativa ainda não disponível para esta variação.</small></div>';const base='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/'+encodeURIComponent(id)+'/';return '<div class="exercise-visual"><div class="eyebrow">Guia visual · início e fim do movimento</div><div class="exercise-photos"><img class="exercise-photo" loading="lazy" alt="Posição inicial: '+esc(name)+'" src="'+base+'0.jpg" onerror="this.style.display=\'none\'"><img class="exercise-photo" loading="lazy" alt="Posição final: '+esc(name)+'" src="'+base+'1.jpg" onerror="this.style.display=\'none\'"></div>'+(muscles?'<span class="muscle-tag">'+esc(muscles[1])+'</span>':'')+'<small class="visual-note">Fotos ilustrativas de exercício semelhante. Confira a máquina, pegada e amplitude com seu instrutor. Fonte: Free Exercise DB.</small></div>'}
function workoutView(){const d=plan[chosen],active=workout&&workout.day===chosen&&!workout.finished;let out=flexActivityView()+'<section><h2>Treino semanal</h2><select onchange="chosen=Number(this.value);render()">'+plan.map((x,i)=>'<option value="'+i+'" '+(chosen===i?"selected":"")+'>'+x.day+'</option>').join("")+'</select><h3>'+d.name+'</h3><p class="muted">Carga por exercício e descanso automático. Seus registros ficam neste navegador.</p>';if(!d.ex.length)return out+'<p>Dia de descanso.</p></section>';if(!active)return out+'<button class="primary" onclick="workoutStart()">▶ Iniciar treino com cronômetro</button>'+d.ex.map((e,i)=>'<article><b>'+(i+1)+'. '+esc(e[0])+'</b><p class="muted">'+esc(e[1])+' · '+esc(e[2])+' · descanso '+esc(e[3])+'</p>'+exerciseVisual(e[0])+exerciseInfo(e[0])+'</article>').join("")+'</section>';out+=timerView();out+='<p class="sessionstatus">Treino em andamento · '+Object.values(workout.sets).reduce((n,a)=>n+a.length,0)+' séries registradas</p>';d.ex.forEach((e,i)=>{const sets=workout.sets[i]||[],isCurrent=i===workout.exercise,done=sets.length>=seriesCount(e);out+='<article class="'+(isCurrent?'exercise-current':'')+'"><b>'+(i+1)+'. '+esc(e[0])+'</b> '+(done?'✓':'')+'<p><span class="pill">'+esc(e[1])+'</span> <span class="pill">'+esc(e[2])+'</span> <span class="pill">Descanso '+esc(e[3])+'</span></p>';if(sets.length)out+='<p class="serieshistory">'+sets.map((x,j)=>(j+1)+'ª: '+x.kg+' kg × '+x.reps+' · RIR '+x.rir).join(' | ')+'</p>';if(isCurrent&&!done){const prev=sets[sets.length-1],suggest=prev?prev.kg:(parseFloat(e[1].replace(",","."))||"");out+='<p class="sessionstatus">Série '+(sets.length+1)+' de '+seriesCount(e)+'</p><div class="row"><label>Carga (kg)<input type="number" id="setweight" min="0.5" step="0.5" value="'+suggest+'"></label><label>Reps<input type="number" id="setreps" min="1" max="100" value="10"></label><label>RIR<input type="number" id="setrir" min="0" max="10" value="2"></label></div><button class="primary" onclick="workoutSaveSet()">✓ Salvar série e iniciar descanso</button>'}out+=exerciseVisual(e[0])+exerciseInfo(e[0])+'</article>'});out+='<button onclick="workoutFinish()">Finalizar treino</button></section>';return out}
let lastRestAlert=false;
function timerTick(){if(!workout?.rest)return;const left=restLeft(),el=document.getElementById("rest-clock");if(el)el.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left===0&&!workout.rest.paused&&!workout.rest.notified){workout.rest.notified=true;workoutSave();if(navigator.vibrate)navigator.vibrate([150,100,150]);if(!playRestSound()&&restSoundEnabled&&restAudio)restAudio.resume().then(()=>{playRestSound()}).catch(()=>{});render()}}
setInterval(timerTick,500);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")timerTick()});

function nav(t){tab=t;if(t==="Treinos")chosen=flexToday();render()}
function render(){document.querySelector("#nav").innerHTML=["Hoje","Treinos","Cardápio","Suplementos","Registrar","Evolução","Conta"].map(t=>'<button class="'+(t===tab?"active":"")+'" onclick="nav(\''+t+'\')">'+t+'</button>').join("");let v="";
if(tab==="Hoje"){const d=plan[flexToday()];v='<section class="hero"><span class="eyebrow">Seu painel diário</span><h2>Seu progresso começa aqui.</h2><p>'+d.day+' · '+d.name+' · '+d.ex.length+' exercícios previstos</p><button class="primary" onclick="chosen='+flexToday()+';nav(\'Treinos\')">Iniciar treino de hoje →</button></section><div class="quick-grid"><button onclick="nav(\'Treinos\')"><span>🏋️</span><strong>Treino guiado</strong></button><button onclick="nav(\'Cardápio\')"><span>🥗</span><strong>Meu cardápio</strong></button><button onclick="nav(\'Registrar\')"><span>✍️</span><strong>Registrar agora</strong></button><button onclick="nav(\'Evolução\')"><span>📈</span><strong>Minha evolução</strong></button></div>'+nutritionSummary()+'<section><h2>Refeições planejadas</h2><p class="muted">Toque nos alimentos para substituir. Registre somente o que consumiu.</p>'+meals.map((m,i)=>mealCard(i)).join('')+'</section>'}
if(tab==="Treinos"){v=workoutView()}
if(tab==="Cardápio"){v=nutritionSummary()+'<section><h2>Cardápio interativo</h2><p class="muted">Toque diretamente no alimento para abrir suas opções de troca. Valores nutricionais são estimativas, não uma tabela laboratorial. As porções do plano estão conferidas matematicamente; metas energéticas e evolução corporal exigem acompanhamento. </p>'+meals.map((m,i)=>mealCard(i)).join('')+'</section>'}
if(tab==="Suplementos"){v='<section><h2>Suplementos informados</h2><article><b>Creatina monohidratada — 5 g/dia</b><p>Evidência forte para força e desempenho de alta intensidade.</p></article><article><b>Whey 80% — 15 g no pré-treino habitual</b><p>Complementa a ingestão de proteína; não é obrigatório se a meta diária for alcançada.</p></article><article><b>Beta Pump — 10 g antes do treino</b><p>Composição e dose de cafeína não verificadas. Seu sono curto merece atenção.</p></article><p class="muted">Orientações gerais, não substituem avaliação profissional.</p></section>'}
if(tab==="Registrar"){v='<section><h2>Registrar alimentação ou observações</h2><label>Tipo <select id="kind"><option>Refeição</option><option>Peso e cintura</option><option>Suplemento</option><option>Observação</option></select></label><label>Descrição <textarea id="detail" rows="5" style="width:100%" placeholder="Ex.: almoço com 250 g arroz, 100 g feijão..."></textarea></label><button class="primary" onclick="if(document.getElementById(\'detail\').value.trim())addLog(document.getElementById(\'kind\').value,document.getElementById(\'detail\').value)">Salvar registro</button><p class="muted">Para enviar fotos ou conversar por voz, abra este projeto no aplicativo ChatGPT. A ligação automática ainda não está implementada.</p></section>'}
if(tab==="Conta"){v=mtnAuthView()+mtnChatView()}
if(tab==="Evolução"){const logs=getLog().slice().reverse();const measures=logs.filter(x=>x.tipo==="Peso e cintura");v='<section><h2>Histórico local</h2><p class="muted">'+measures.length+' registro(s) de peso e cintura. Os gráficos serão exibidos quando houver medidas numéricas suficientes.</p><button onclick="const a=document.createElement(\'a\');a.href=URL.createObjectURL(new Blob([JSON.stringify(getLog(),null,2)],{type:\'application/json\'}));a.download=\'meu-treino-nutri-backup.json\';a.click()">Exportar backup</button>'+(!logs.length?'<p>Nenhum registro ainda.</p>':logs.map(x=>'<article><small>'+new Date(x.at).toLocaleString("pt-BR")+' · '+esc(x.tipo)+'</small><p>'+esc(x.detalhe)+'</p></article>').join(''))+'</section>'}
document.querySelector("#view").innerHTML=v}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script><script src="./sync.js?v=login-fix-8c27d4b"></script></body></html>
